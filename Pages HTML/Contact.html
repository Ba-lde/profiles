<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

<section class="py-16 bg-white font-sans">
  <div class="container mx-auto px-4 max-w-5xl">
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
      
      <div class="group text-center">
        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:bg-gray-800 group-hover:text-white transition-colors duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </div>
        <h4 class="font-bold text-gray-800 mb-2 text-lg">Address</h4>
        <p class="text-gray-500">6834 Hollywood Blvd - Los Angeles CA</p>
      </div>

      <div class="group text-center">
        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:bg-gray-800 group-hover:text-white transition-colors duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <h4 class="font-bold text-gray-800 mb-2 text-lg">Email</h4>
        <p class="text-gray-500">Support@website.com</p>
      </div>

      <div class="group text-center">
        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:bg-gray-800 group-hover:text-white transition-colors duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
        </div>
        <h4 class="font-bold text-gray-800 mb-2 text-lg">Phone</h4>
        <p class="text-gray-500">+20 010 2517 8918</p>
      </div>
    </div>

    <form action="#" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" placeholder="Name" 
               class="w-full p-4 bg-[#f4f4f4] border-none rounded-md focus:ring-1 focus:ring-gray-300 outline-none placeholder-gray-500">
        <input type="email" placeholder="Email" 
               class="w-full p-4 bg-[#f4f4f4] border-none rounded-md focus:ring-1 focus:ring-gray-300 outline-none placeholder-gray-500">
      </div>
      
      <textarea placeholder="Message" rows="6" 
                class="w-full p-4 bg-[#f4f4f4] border-none rounded-md focus:ring-1 focus:ring-gray-300 outline-none placeholder-gray-500 resize-none"></textarea>
      
      <button type="submit" 
              class="bg-[#1c1c1c] text-white px-10 py-3 rounded-md hover:bg-white hover:text-[#1c1c1c] border border-[#1c1c1c] transition-all duration-300 font-medium">
        Submit
      </button>
    </form>

  </div>
</section>


</body>
</html>
