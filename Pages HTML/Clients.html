
<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">
<section class="py-20 bg-white font-sans">
  <div class="container mx-auto px-4">
     <h1 class="text-center font-black  text-[40px] p-8 text-[#343434]">Testimonials.</h1>
    <div class="text-center max-w-3xl mx-auto mb-20">
      <img src="../images/1 (1).jpg" alt="Alex Smith" class="w-24 h-24 rounded-full mx-auto mb-6 border-4 border-gray-100 shadow-sm">
      <p class="text-gray-500 italic  text-lg mb-6">
        "Lorem Ipsum has been the industry's standard dummy text ever since the when an unknown printer took a galley of type and scrambled it to make a type specimen book."
      </p>
      <h4 class="font-bold text-xl text-gray-800">Alex Smith</h4>
      <p class="text-sm text-gray-400 mt-1">Envato Customer</p>
      
      <div class="flex justify-center space-x-2 mt-8">
        <span class="w-3 h-3 bg-gray-300 rounded-full cursor-pointer hover:bg-gray-500 transition"></span>
        <span class="w-3 h-3 bg-gray-600 rounded-full cursor-pointer"></span>
        <span class="w-3 h-3 bg-gray-300 rounded-full cursor-pointer hover:bg-gray-500 transition"></span>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-8 text-center border-t border-gray-100 pt-16">
      
      <div class="stat-item">
        <div class="text-3xl mb-4 flex justify-center text-gray-700"><i class="fa-solid fa-users"></i></div>
        <span class="counter text-5xl font-black text-gray-800" data-target="850">0</span>
      </div>

      <div class="stat-item">
        <div class="text-3xl mb-4 flex justify-center text-gray-700"><i class="fa-solid fa-thumbs-up group-hover:text-white transition"></i></div>
        <span class="counter text-5xl font-black text-gray-800" data-target="230">0</span>
      </div>

      <div class="stat-item">
        <div class="text-3xl mb-4 flex justify-center text-gray-700"> <i class="fa-solid fa-bullhorn group-hover:text-white transition"></i></div>
        <span class="counter text-5xl font-black text-gray-800" data-target="9450">0</span>
      </div>

      <div class="stat-item">
        <div class="text-3xl mb-4 flex justify-center text-gray-700"><i class="fa-solid fa-cloud-arrow-down"></i></div>
        <span class="counter text-5xl font-black text-gray-800" data-target="780">0</span>
      </div>

    </div>
  </div>
</section>

</body>
</html>
